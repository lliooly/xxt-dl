name: Package Desktop Apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish. Defaults to v<package.json version>."
        required: false
        type: string
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            command: npm run dist:mac
            artifact: release-macos
            platform: macos
          - name: Windows
            os: windows-latest
            command: npm run dist:win
            artifact: release-windows
            platform: windows
          - name: Linux
            os: ubuntu-latest
            command: npm run dist:linux
            artifact: release-linux
            platform: linux

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PLAYWRIGHT_BROWSERS_PATH: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build packages
        run: ${{ matrix.command }}

      - name: Validate release artifacts
        run: npm run validate:release -- --platform ${{ matrix.platform }} --root release

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*-win-*.exe
            release/*.yml
            release/**/*.blockmap
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi

          if [[ "${tag}" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Validate downloaded release artifacts
        run: npm run validate:release -- --platform all --root release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: XXT DL ${{ steps.release.outputs.tag }}
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ steps.release.outputs.prerelease }}
          body_path: .github/release-intro.md
          generate_release_notes: true
          files: |
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.dmg
            release-artifacts/**/*-win-*.exe
            release-artifacts/**/*.yml
            release-artifacts/**/*.blockmap
