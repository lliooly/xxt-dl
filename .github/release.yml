changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: 新功能
      labels:
        - feature
        - enhancement
    - title: 修复
      labels:
        - bug
        - fix
    - title: 文档
      labels:
        - documentation
    - title: 依赖更新
      labels:
        - dependencies
    - title: 其他变更
      labels:
        - "*"
